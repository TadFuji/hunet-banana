name: 不具合の報告
description: ダミーキーと共有可能な素材で再現できる不具合を報告します。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        APIキーの漏洩につながる問題は、SECURITY.mdの非公開報告へ進んでください。
        実キー、請求情報、非公開の作品は、本文・画像・ログに含めないでください。
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 操作、設定、発生した画面を順番に記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作と実際の動作
      description: アプリの短いエラー文は記載できます。実APIの通信ログは添付しないでください。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 利用環境
      placeholder: '例: macOS / Chromeのバージョン / 公開URLまたはローカル'
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開内容の確認
      options:
        - label: 実APIキー・個人情報・非公開作品を含めていません。
          required: true
